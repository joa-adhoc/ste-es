  - id: STE-F01
    category: diagnosis
    structure: false
    requires: []
    perfil: soporte
    prompt: |
      Revisá el ticket 140512, mirá con introspección y logs en caso de ser necesario.

      Material:
      ---
      Ticket 140512 — «Error ValueError al evaluar regla de acceso de stock»
      - Base del cliente: Odoo 19.0, imagen 19.0.2026.11.04. Etapa Nuevo, sin asignar, sin producto ni módulo cargados.
      - Descripción del cliente: «Estaba cargando stock y apareció el error. User: 31. Error date (UTC): 2026-11-04 15:09:12».
      - Traceback: al evaluar una regla de acceso (safe_eval), `AttributeError: 'res.users' object has no attribute '_get_branch_stock_root_ids'`.

      Introspección de la base (hoy):
      - El método `_get_branch_stock_root_ids` está definido en `stock_account_multicompany_ux/models/res_users.py`, y `models/__init__.py` importa `res_users`.
      - Módulos: `account_multicompany_ux` instalado 19.0.1.10.0 (actualizado 2026-11-04 15:07:39 UTC); `stock_account_multicompany_ux` instalado 19.0.1.7.0 (actualizado 15:08:01 UTC).
      - Reglas de acceso cuyo dominio llama a `user._get_branch_stock_root_ids(...)`: 507 «Location multi-company: read (branch stock aware)» y 508 «stock_quant multi-company: read (branch stock aware)». Las dos se reescribieron el 2026-11-04 a las 15:08:01 UTC.

      Logs de la instancia, 2026-11-04, en UTC (hora argentina = UTC − 3):
      - 15:06:29–15:06:58: arranca el pod A y carga 233 módulos.
      - 15:08:36–15:08:39: el pod A recarga el registro cuatro veces seguidas. En el medio, tres errores del uid 31 (15:08:37, 15:08:38, 15:08:38): `AttributeError: 'res.users' object has no attribute '_get_branch_stock_root_ids'`.
      - 15:08:40: en el pod A falla el cron «Consolidation: bring currency rates in»: `AttributeError: 'res.company' object has no attribute '_cron_update_consolidation_rates'`.
      - 15:08:53: arranca el pod B, con la imagen nueva. 15:08:58: el pod A se apaga («Stopping workers gracefully»).
      - 15:09 a 15:30: ningún error en el pod B (39 líneas filtradas, conteo completo, sin páginas pendientes).
      ---
    pass_criteria:
      - fact: "No hay que actualizar la imagen ni ningún módulo: la base ya tiene la imagen y los módulos nuevos, y el método existe en el código que corre hoy."
        condition: false
      - fact: "Fue un error pasajero durante la actualización del 04/11: por unos segundos (alrededor de las 12:08 hora argentina) un pod con el código anterior leyó las reglas nuevas, que llaman a un método que ese código no tenía. Desde que arrancó el pod nuevo no se repitió."
        condition: false
      - fact: "Lo que el usuario estaba cargando en ese momento no se guardó: tiene que volver a cargarlo."
        condition: false
      - fact: "Solo si al reintentar vuelve a fallar es otro problema y hay que seguir investigando."
        condition: true
      - fact: "El fallo del cron de consolidación tiene probablemente la misma causa; se confirma en su próxima corrida, y si vuelve a fallar es otro problema."
        condition: true
      - fact: "Que el pod viejo siga atendiendo mientras se actualizan los módulos es un tema de infraestructura, no del cliente."
        condition: false
    control:
      - q: "¿Hay que actualizar la imagen o algún módulo?"
        a: "No: la base ya tiene todo actualizado y el método existe en el código actual; fue un corte de segundos durante la actualización."
      - q: "¿Qué tiene que hacer el cliente?"
        a: "Volver a cargar el stock que intentaba guardar a las 12:08; ahora debería funcionar."
      - q: "¿Qué tiene que hacer el analista ahora?"
        a: "Contestarle al cliente que fue un corte momentáneo de la actualización y que reintente, mirar la próxima corrida del cron de consolidación y, si quiere, reportar a infraestructura lo del pod viejo."
    repregunta_real: "PERO ¿QUÉ HAY QUE HACER? ¿Actualizar la imagen, algún módulo? Decime próximos pasos."
    fuente: "pod Tuqui Work, 2026-11"

  - id: STE-F02
    category: explanation
    structure: false
    requires: []
    perfil: soporte
    prompt: |
      Revisá el ticket 138210. ¿Hay algo nativo? ¿CC en las plantillas de correo? ¿Algo por el estilo?

      Material:
      ---
      Ticket 138210 — «Que las notificaciones de facturas de cliente lleguen a Administración y no a vendedores ni usuarios internos (urgente, antes del 25/10)». Base del cliente en Odoo 18. Etapa Revisión Técnica.

      Descripción del cliente:
      - Los correos de las facturas se envían con copia a los vendedores asociados a las suscripciones, que son usuarios de portal. Según el cliente, pasa porque el vendedor se agrega solo como seguidor de la factura con el subtipo «Debates».
      - Cuando el cliente final responde el correo, la notificación le llega al seguidor de la factura (dos usuarios internos, Usuario A y Usuario B) y no a Administración. Ejemplo: factura FA-E 00003-00001234, respuesta del 19/10 a las 14:01.
      - Los seguidores de la suscripción no se copian a la factura, así que corregirlos ahí no resuelve nada.
      - Resultado esperado: todas las facturas y notas de crédito de clientes con Administración como destinataria, y sin vendedores ni usuarios internos.

      Descripción interna (analista anterior):
      - La base no tiene personalizaciones ni reglas automáticas activas.
      - El pedido incluye: una política automática de destinatarios para facturas y notas de crédito; quitar ciertos seguidores conservando al cliente, sus contactos y Administración; corregir en forma masiva los documentos históricos; cubrir la validación y el envío posteriores.
      - El código que propone el ticket solo agrega Administración: no saca a nadie.
      - Acciones automáticas y de servidor están fuera del alcance de Asistencia: recomienda derivar a Consultoría.
      Chatter: el líder del equipo dejó el ticket en Revisión Técnica «para verificar una opción nativa que cumpla con las expectativas del cliente o ir por personalización».

      Lo que muestra la base:
      - La factura de ejemplo la creó el cron de suscripciones. Seguidores: el cliente final y Usuario A (interno, recibe notificaciones por correo). El vendedor de la factura no es seguidor.
      - Usuario A la validó el 01/10. Los cinco diarios de venta electrónicos tienen plantilla de envío automático, y el módulo `account_ux` manda la factura al validarla. El código de Odoo suscribe como seguidor al autor de cada envío, sin opción para apagarlo.
      - Hay dos «Administración» con el mismo correo: el contacto C1, sin usuario, y el usuario interno «Administración» (contacto C2), configurado como «Gestionar en Odoo» (las notificaciones quedan en la bandeja de Odoo, no van al correo).
      - Seguidores de facturas de cliente de 2026: usuario «Administración» (C2) en unas 4.600; seis vendedores con usuario portal en unas 4.100; Usuario A en unas 1.100; contacto C1 en unas 500.
      - Para/CC de la plantilla: en 18 el envío de facturas toma `partner_to` y `email_cc` de la plantilla, manual o automático. Manda copia de la factura, pero no suma seguidores: las respuestas no le llegan.
