    prompt: |
      Ayudame a responder esto:

      1. Permisos: la documentación pide un usuario con Ajustes como Administrador. ¿Es imprescindible, o alcanza con permisos de Ventas, Inventario y Facturación? ¿Desde qué direcciones IP se conecta Odumbo, así limitamos el acceso a nuestro servidor?
      2. Kits: un pack de 4 patas es en Odoo un kit (lista de materiales tipo kit). ¿Odumbo publica como stock lo que Odoo calcula para el kit, y al vender descuenta las patas?
      3. El cambio desde nuestro módulo actual, que también trae las ventas y factura: ¿qué pasos recomiendan para no duplicar ventas ni facturas el día del cambio?
      4. Facturación automática: recomiendan tipos de pedido de venta para que la factura salga sola. ¿Con qué módulo se hace en Odoo 17 Enterprise? Si facturamos a mano en lote cada día, ¿Odumbo las sube igual?
      5. Datos: ¿qué datos nuestros guarda Odumbo además de las credenciales, y qué hacen con ellos si damos de baja el servicio?

      Material:
      ---
      Manual público de Odumbo:
      - Permisos del usuario de la conexión: Administración: Ajustes; Ventas: Administrador; Contabilidad: Facturación; Inventario: Administrador; en Technical Settings, Gestión de Productos y Límite de crédito. Ajustes «le permite a Odumbo leer la configuración de tu base: qué aplicaciones tienes instaladas, qué empresas existen y cómo está armado el catálogo».
      - Firewall o lista de IPs permitidas: «si necesitas los datos técnicos de la conexión para pasárselos, pídelos con un ticket». No figura ninguna IP.
      - Stock publicado = cantidad «A la mano» − cantidad «Saliente», en la ubicación de stock configurada. El stock se descuenta aunque no factures: al confirmar la venta, Odoo genera la entrega.
      - Facturas: Odumbo no factura. Las facturas se generan y validan en Odoo, en forma individual o masiva, y Odumbo las detecta y las sube a la venta de Mercado Libre, entre 6 y 24 horas después. Para que la factura salga sola al confirmar la venta, se recomiendan los tipos de pedido de venta. La subida de facturas aplica solo a Mercado Libre.

      Código del conector:
      - El chequeo de conexión exige «Settings / Administrator» en todas las versiones de Odoo; en 19, si falta, corta antes de revisar el resto. También crea un campo técnico de precio en `product.product` y registros en `ir.model.data`.
      - Para el stock lee `qty_available` y `outgoing_qty` de cada producto, con la ubicación configurada en el contexto. No hay nada específico de kits (`mrp`, `phantom`). Saltea los productos no almacenables, salvo los packs.

      Sin fuente en el manual, las specs ni el código: las IPs de salida, el cambio desde otro conector, qué datos guarda Odumbo además de las credenciales, qué pasa con ellos en la baja, y qué módulo da los tipos de pedido de venta en Odoo 17 Enterprise.
      ---
    pass_criteria:
      - fact: "El permiso de Administración: Ajustes es necesario: el chequeo de conexión lo exige y corta si falta, así que con Ventas, Inventario y Facturación no alcanza."
        condition: false
      - fact: "Las IPs no están documentadas: se piden por ticket o hay que confirmarlas antes de responder."
        condition: true
      - fact: "Odumbo publica lo que Odoo informa como A la mano menos Saliente en la ubicación configurada; para kits no hay fuente, así que conviene probarlo en una base de prueba antes de pasar a producción."
        condition: true
      - fact: "Odumbo no factura: sube las facturas validadas en Odoo, también las generadas en forma masiva, entre 6 y 24 horas después."
        condition: false
      - fact: "El cambio desde el módulo actual, los datos guardados y su destino en la baja, y el módulo de tipos de pedido en 17 Enterprise no tienen fuente: quedan para confirmar antes de mandar la respuesta."
        condition: true
    control:
      - q: "¿Hace falta el permiso de Ajustes?"
        a: "Sí: el chequeo de conexión lo exige; con Ventas, Inventario y Facturación no alcanza."
      - q: "Si facturan a mano en lote, ¿Odumbo las sube?"
        a: "Sí: sube las facturas validadas en Odoo, individuales o masivas, entre 6 y 24 horas después."
      - q: "¿Qué no se le puede contestar todavía al cliente?"
        a: "Las IPs, cómo se comporta con kits (hay que probarlo), el cambio desde su módulo actual, los datos guardados y la baja, y el módulo de tipos de pedido en 17 Enterprise."
    repregunta_real: "Más corto, tipo mail."
