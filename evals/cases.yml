      - q: "¿Qué hizo el usuario que originó el problema?"
        a: "Canceló la orden después de recibir y facturar, y la volvió a borrador; al reconfirmarla aparece el error."
      - q: "¿Qué tiene que hacer el analista para regularizar?"
