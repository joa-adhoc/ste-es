  - id: STE-F03
    category: flow
    structure: true
    requires: []
    perfil: soporte
    prompt: |
      Revisá el ticket 139447.

      Material:
      ---
      Ticket 139447 — «Error al confirmar P00231 — traslado 416». Base del cliente en Odoo 19.0. Producto: Compras.
      Texto del ticket: «Al intentar CONFIRMAR ORDEN la orden de compra P00231 del Proveedor A, Odoo muestra: "No puedes eliminar los traslados porque 'Bloquear eliminación de traslados' está establecido en el tipo de operación 'Recepciones' o el estado de los traslados no es borrador o cancelado. id de los traslados: [416]". La orden figura como borrador. Tiene asociada la recepción WH/IN/00098, en estado Hecho, con 2 unidades recibidas. La factura de proveedor BILL/2026/11/0007 está contabilizada. El error inicial mencionaba el traslado 415, y al reintentar mencionó el 416; en la orden, la recepción vinculada es la 412. ¿Podrían revisar qué traslado intenta eliminar Odoo y cómo regularizar la orden sin desajustar el stock ni la factura?»

      Datos en la base:
      - Orden P00231: estado borrador; recepción 412; factura BILL/2026/11/0007; una línea de 2 unidades, 2 recibidas y 2 facturadas.
      - Recepción 412 (WH/IN/00098): Hecho, validada el 11/11 a las 12:27. Los traslados 415 y 416 no existen en la base.
      - Factura BILL/2026/11/0007: contabilizada, unos $70.000, origen P00231.
      - Historial de la orden, todo el 11/11 y por el mismo usuario: 12:26 Solicitud de cotización → Orden de compra; 12:27 cantidad recibida 0 → 2; 13:26 Orden de compra → Cancelado; 13:27 Cancelado → Solicitud de cotización.
      - Tipo de operación «Recepciones»: `block_picking_deletion` = True.

      Código:
      - `stock_ux` (módulo de Odoo by Adhoc), `stock_picking.py`, `_check_block_picking_deletion`: al borrar un traslado, si su tipo de operación tiene «Bloquear eliminación de traslados» o el traslado no está en borrador o cancelado, lanza ese error.
      - Odoo estándar, `purchase_stock/models/purchase_order.py` (líneas 383-404): al confirmar, crea la recepción de la orden; si esa recepción queda sin movimientos, la borra (`created_receipt.unlink()`).
      - No se leyó el código que decide si una orden con recepciones hechas se puede cancelar.
      ---
    pass_criteria:
      - fact: "Al confirmar, Odoo crea una recepción nueva; como las 2 unidades ya se recibieron, queda vacía y Odoo la intenta borrar."
        condition: false
      - fact: "stock_ux impide ese borrado porque Recepciones tiene «Bloquear eliminación de traslados»; sale el error y se deshace todo. Por eso el número de traslado cambia en cada intento y esos traslados no existen."
