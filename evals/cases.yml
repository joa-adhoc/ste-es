  - id: STE-F04
    category: diagnosis
    structure: false
    requires: []
    perfil: actualizacion
    prompt: |
      Ayer seguí analizando el ticket y pude replicar el problema. Pasa así: el usuario entra al menú Contactos, busca el contacto, entra al formulario y va al reporte de seguimiento. Como ahí no ve todas las facturas, en el filtro elige el libro mayor de la empresa, y ahí sí las ve. Abre una factura del punto 22, toca los tres puntitos, «Ver asientos», y le sale el error que nos pasó el cliente: que no tiene permiso para leer, y que las siguientes reglas lo impiden. Le encuentro lógica: no puede ver lo que no tiene permiso, porque él solo tiene la sucursal Norte. Entiendo que en la 16 los permisos estaban más livianos y ahora se reforzaron. Lo confuso es que el mismo usuario desde ese reporte no puede ver, pero si va al libro mayor de Contabilidad, sí. Habría que unificar o entender el criterio: si no ve, que no vea en ningún lado.

      Material:
      ---
      Base productiva del cliente, Odoo 18.0 (actualizada desde 16), leída por introspección:
      - Reglas de registro sobre `account.journal`:
        - «Journal multi-company»: por compañía; lectura y escritura.
        - «Journal multi-store» (módulo `account_multi_store`): diarios sin sucursal o de las sucursales del usuario; `perm_read` = False (solo restringe escribir, crear y borrar).
        - «Journals modifiable by users» y «Journals restricted to users» (módulo `account_journal_security`): solo aplican a diarios con usuarios cargados.
      - Ningún diario de venta tiene usuarios cargados en `user_ids` ni en `modification_user_ids`.
      - El diario del punto 22 («FACTURA ELECTRONICA SUR») es de la sucursal Sur. El usuario «Encargado Norte» tiene sucursal Norte y ningún diario asignado.
      - `account_multi_store`, reglas sobre asientos y pagos: también con `perm_read` = False.
      - `account_multi_store`, ayuda del campo `store_id` del diario: «los usuarios que no son de esta sucursal solo pueden ver los registros de este diario, pero no pueden publicar ni modificar asientos».
      - `account_multi_store` sobrescribe `account.journal._search`: a todo usuario que no sea superadmin le agrega el filtro «diario sin sucursal o de sus sucursales». Comentario del código: lo hicieron en la búsqueda y no con una regla de permiso, porque si los usuarios no pueden ver los diarios hay errores en cualquier lugar donde se use un campo relacionado con el diario.
      - No se leyó el código del reporte de seguimiento (`account_followup`) ni del libro mayor, ni el de la 16. Falta el traceback del error.
      ---
    pass_criteria:
      - fact: "El usuario es de la sucursal Norte y la factura del punto 22 es de un diario de la sucursal Sur; el bloqueo viene de las sucursales, no de la restricción de diarios por usuario, que no está configurada."
        condition: false
      - fact: "Por diseño, el módulo de sucursales deja ver los registros de diarios de otra sucursal y solo impide modificarlos: sus reglas no restringen la lectura."
        condition: false
      - fact: "Hipótesis: el filtro que el módulo agrega a la búsqueda de diarios esconde los de otras sucursales, y «Ver asientos» desde el reporte de seguimiento pasa por ese filtro, mientras que el libro mayor no. No está verificado."
        condition: true
      - fact: "Si se confirma, es un defecto del producto (módulo account_multi_store) y no algo para cambiar en la configuración del cliente: el usuario debería poder ver la factura en los dos lugares."
        condition: true
      - fact: "Para confirmarlo falta el traceback del error al repetirlo, con los logs de la instancia."
        condition: false
    control:
      - q: "¿Cuál es la hipótesis, sin campos técnicos?"
        a: "El módulo de sucursales quiere que un usuario vea, sin modificar, lo de otras sucursales, pero un filtro del mismo módulo esconde esos diarios en algunas pantallas, como «Ver asientos» desde el reporte de seguimiento."
      - q: "¿Hay que cambiar la configuración del cliente?"
        a: "No: apunta a corregir el módulo de sucursales; por diseño el usuario debería poder ver la factura."
      - q: "¿Qué prueba puede hacer el analista?"
        a: "Repetir el caso con los logs para obtener el traceback y ver qué falla exactamente."
    repregunta_real: "Paramos de vuelta, porque mandaste muchos campos y no termino de entender lo de store_id y demás. Bajámelo más a tierra, resumido: cuál sería la hipótesis de lo que está pasando, qué producto sería, por dónde podría venir y si puedo hacer alguna prueba. El detalle funcional, resumido."
