  - id: STE-F06
    category: comparison
    structure: false
    requires: []
    perfil: actualizacion
    prompt: |
      Cosas para ver; el código que tenés que comparar es el de 16 y el de 18. ¿El cliente tiene alguna personalización en esto? ¿Me podés traer dónde se trató en el proyecto, dónde está ese borrador o tarea?

      Material:
      ---
      Contexto: el cliente se actualizó de Odoo 16 a 18. Al depositar o transferir cheques con el asistente de transferencia masiva (`l10n_latam.payment.mass.transfer`), el asistente corta con «Your user requires to use payment session on each tranfer». Los intentos fallidos son del 02/11, a las 09:13 hora argentina.

      Módulo `account_cashbox_l10n_latam_check`, asistente de transferencia, 16 contra 18:
      - En las dos versiones la validación es la misma: si el usuario tiene marcado «requiere sesión de caja» y el asistente no tiene sesión, lanza ese error.
      - 16: la sesión se guarda (`store=True`). Se calcula una vez al abrir: si el usuario tiene una sola sesión abierta, la pone. El desplegable ofrece las sesiones abiertas del usuario en la compañía.
      - 18: la sesión no se guarda. Se recalcula cuando cambia el diario destino, y solo ofrece sesiones de cajas que manejan ese diario. Al cambiar el diario destino, la sesión elegida se borra.
      - El guardado de la sesión se sacó en noviembre de 2025 y el filtro por diario se agregó en abril de 2026. El cambio que sacó el guardado no tiene tarea vinculada: no se sabe por qué se hizo.
      - Otro cambio de 18: `l10n_latam_check_ux` reescribió la creación de los pagos del asistente (setiembre de 2026). En la base del cliente, sus vistas se actualizaron el 02/11 a las 05:11 y 05:26 hora argentina, la misma mañana de los errores. No se ve por qué eso haría fallar el control de sesión, que es anterior. No está probado.

      Personalizaciones del cliente: ninguna en esto. No hay módulos a medida; las tres vistas del asistente vienen de módulos estándar; no hay campos manuales. No se revisaron reglas de acceso ni acciones automatizadas sobre las sesiones de caja.

      Antecedentes en el proyecto de mejoras de I+D:
      - Tarea 41001 «Sesiones de caja v16»: origen del módulo.
      - Tarea 41002 «Cashbox - Transferencia de cheques» (2023): nació el asistente; en las pruebas apareció el mismo error, en 16.
      - Tarea 41003 «Indicar sesión en transferencia masiva de cheques» (2023): pedido relacionado.
      - Tarea 41004 «Método de pago del diario destino» (18 y 19): el cambio de `l10n_latam_check_ux`; Realizada, salió en la imagen 18.0.2026.09.24. Su borrador de spec sigue diciendo «Borrador», aunque ya está en producción.
      - Tarea 41005 (19): permitir elegir la sesión antes que el diario. Describe que en 18 «se elegía la sesión y el diario se ajustaba».
      - Tarea 41006 (otro cliente): el segundo pago de la transferencia no recibe la sesión.
      - No hay tarea ni borrador sobre este error en 18.
      ---
    pass_criteria:
      - fact: "En 16 la sesión que se elegía en el asistente quedaba guardada; en 18 no se guarda y depende del diario destino: si se cambia el diario se borra, y solo se ofrecen sesiones de cajas que manejan ese diario."
        condition: false
      - fact: "El control que da el error es el mismo en las dos versiones: si el usuario requiere sesión y el asistente llega sin sesión, corta."
        condition: false
      - fact: "El cliente no tiene personalizaciones en esto."
        condition: false
      - fact: "No está tratado: no hay tarea ni borrador sobre este error en 18; solo antecedentes relacionados, como el mismo error en 16 en 2023 y el cambio de 19 para elegir la sesión antes que el diario."
        condition: false
      - fact: "Un cambio de l10n_latam_check_ux llegó la misma mañana de los errores; coincide en el tiempo, pero no está probado que los cause."
        condition: true
      - fact: "No se sabe por qué se sacó el guardado de la sesión: ese cambio no tiene tarea vinculada."
        condition: true
    control:
      - q: "¿Qué cambió de 16 a 18, en términos funcionales?"
        a: "En 16 la sesión elegida quedaba fija; en 18 depende del diario destino y se borra si se cambia el diario, así que el asistente puede llegar sin sesión y cortar."
      - q: "¿El cliente tiene personalizaciones en esto?"
        a: "No."
      - q: "¿Es algo que ya se trató?"
        a: "No: no hay tarea ni borrador de este error en 18; hay antecedentes relacionados (el mismo error en 16 en 2023, el cambio de 19 y un caso de otro cliente)."
    repregunta_real: "No me termina de quedar claro entonces. ¿Me podés bajar todo lo que me dejaste en modo funcional? ¿Es algo que ya se trató?"
    fuente: "pod Tuqui Work, 2026-11"

  # --- Consultoría funcional ---

  - id: STE-F07
    category: conditional
    structure: false
    conditional: true
    requires: []
    perfil: consultoria
    prompt: |
      ¿Te puedo pedir que me armes un archivo de importación masiva de recibos y otro de pagos a proveedores, con los campos obligatorios? Haceme uno separado para cheques, porque creo que se abre la solapa de cheques. Agregá también las líneas de retención, porque tiene retenciones. ¿Y es posible indicar, al importar el recibo, en el campo de deudas, qué factura se está saldando, para que al confirmarlo se concilie contra esa factura?

      Material:
      ---
      Código de Odoo by Adhoc 18 (módulos instalados en la base del cliente: `account_payment_pro`, `account_payment_pro_receiptbook`, `l10n_latam_check_ux`, `l10n_ar_withholding`, `l10n_ar_tax`):
      - `account.payment`, obligatorios: `partner_type` (customer / supplier), `payment_type` (inbound / outbound), `partner_id`, `date`, `journal_id`, `payment_method_line_id`. El talonario de recibos (`receiptbook_id`) se calcula solo.
      - `amount`: en pagos con cheques se calcula como la suma de los cheques.
      - Cheques nuevos: `l10n_latam_new_check_ids` (número, fecha de pago, banco, CUIT del emisor, monto). Monto mayor a 0; el CUIT se valida; banco y CUIT, si quedan vacíos, salen del cliente.
      - Retenciones: `l10n_ar_withholding_line_ids` (impuesto obligatorio, número, base, importe). En pagos a proveedores se calculan solas según la posición fiscal; el número lo pone la secuencia al confirmar.
      - Deudas: `to_pay_move_line_ids`, Many2many a `account.move.line` («las líneas que el usuario eligió pagar»). Guardado y editable. En borrador, al cambiar cliente, compañía o tipo, se recalcula con toda la deuda abierta del cliente.
      - Al confirmar (`_reconcile_after_post`), concilia el pago contra los apuntes de `to_pay_move_line_ids` que alcanza a cubrir.
      - Control: los apuntes de deuda tienen que ser de cuentas compatibles (`@api.constrains("to_pay_move_line_ids")`).
      - Al importar, un campo Many2many se completa con la columna `to_pay_move_line_ids/id` y el identificador externo de cada apunte, separados por coma. Ese identificador sale de exportar los apuntes (Contabilidad › Apuntes contables, filtrando la factura y la cuenta a cobrar o a pagar) con la opción «compatible con importación».
      - Los pagos importados quedan en borrador.
      - Nada de esto se probó importando en la base del cliente.
      ---
    pass_criteria:
      - fact: "Sí se puede indicar qué factura salda el recibo: la solapa Deudas es el campo to_pay_move_line_ids, y al confirmar el recibo se concilia contra lo que tenga cargado."
        condition: false
      - fact: "La columna no lleva el número de la factura sino el identificador del apunte contable de la factura en la cuenta a cobrar (o a pagar), que se obtiene exportando los apuntes con la opción compatible con importación."
        condition: true
      - fact: "Si no se completa la columna, Odoo carga toda la deuda abierta del cliente y al confirmar concilia lo que alcance a cubrir el importe."
        condition: true
      - fact: "El apunte tiene que estar abierto y ser del mismo cliente."
        condition: true
      - fact: "Los recibos importados quedan en borrador y se concilian al confirmarlos."
        condition: false
      - fact: "No está probado importando en la base del cliente: conviene probarlo primero en una base de test."
        condition: true
    control:
      - q: "¿Puede poner en una columna el número de la factura que salda?"
        a: "No directamente: la columna to_pay_move_line_ids/id lleva el identificador del apunte de la factura, que sale de exportar los apuntes de esa factura."
      - q: "¿Qué pasa si deja esa columna vacía?"
        a: "Se carga toda la deuda abierta del cliente y, al confirmar, se concilia lo que alcance a cubrir el importe."
      - q: "¿Cuándo se concilia?"
        a: "Al confirmar los recibos, que quedan en borrador después de importar."
    repregunta_real: "Pará, entonces no entendí, ¿no puedo tener una columna con el número de la factura que se está saldando al importar el recibo?"
    fuente: "pod Tuqui Work, 2026-11"

