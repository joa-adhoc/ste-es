      Pegué sin querer la API key de OpenAI en un commit y ya lo pusheé a mi rama, con el PR abierto. ¿Alcanza con borrar el commit?

      Material:
      ---
      Extracto de docs/seguridad.md:

      - Un secreto que llegó a un remoto se da por filtrado. Se rota aunque después se borre el commit o se reescriba la historia: GitHub guarda los commits de un PR y el preview de Railway ya construyó la imagen con ese commit.
      - Rotación de la key de OpenAI: se crea una nueva en el panel de OpenAI, se carga en Admin › Integraciones de staging y de prod, y recién después se revoca la vieja. La key no va en variables de entorno de Railway.
      - Para limpiar la rama, `git rebase -i` y `git push --force-with-lease`. `git push --force` sin lease está bloqueado.
      - Se avisa en la tarea abierta del proyecto 1526 (Administración Tuqui) con qué key se rotó y cuándo.
      ---
