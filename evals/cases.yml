      - fact: "La razón: GitHub guarda los commits del PR y el preview de Railway ya construyó la imagen con ese commit."
        condition: true
      - fact: "La rotación es: key nueva en el panel de OpenAI, cargarla en Admin › Integraciones de staging y prod, y recién después revocar la vieja; no va en variables de entorno de Railway."
        condition: true
      - fact: "La rama se limpia con git rebase -i y git push --force-with-lease (el --force sin lease está bloqueado)."
        condition: false
      - fact: "Hay que avisar en la tarea abierta del proyecto 1526 qué key se rotó y cuándo."
        condition: false
    control:
      - q: "¿Alcanza con borrar el commit?"
        a: "No: la key se da por filtrada y hay que rotarla, porque GitHub guarda los commits del PR y el preview ya la usó."
      - q: "¿En qué orden se rota?"
        a: "Key nueva en OpenAI, cargarla en Admin › Integraciones de staging y prod, y después revocar la vieja."
      - q: "¿Dónde se avisa?"
        a: "En la tarea abierta del proyecto 1526 (Administración Tuqui)."
    source: "sintético, sobre las reglas de secretos del equipo"

